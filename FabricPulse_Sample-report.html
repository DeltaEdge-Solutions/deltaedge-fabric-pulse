                  padding: '20px',
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                  cursor: 'pointer',
                  borderLeft: `4px solid ${roleColor(node.role)}`
                }}
                onClick={() => toggleNode(node.id)}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <StatusDot active={node.fabricSt === 'active' || node.fabricSt === 'commissioned'}/>
                    <div>
                      <p style={{ fontWeight: 600, fontSize: '0.9rem', color: '#1A1D2E' }}>{node.name}</p>
                      <p style={{ fontSize: '0.72rem', color: '#6B7280' }}>Node {node.id} · {node.address}</p>
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <Badge label={node.role} color={roleColor(node.role)} bg={roleBg(node.role)}/>
                    <Badge
                      label={node.fabricSt}
                      color={node.fabricSt === 'active' || node.fabricSt === 'commissioned' ? '#059669' : '#DC2626'}
                      bg={node.fabricSt === 'active' || node.fabricSt === 'commissioned' ? '#ECFDF5' : '#FEF2F2'}/>
                    <span style={{ color: '#9CA3AF', fontSize: '0.75rem' }}>{node.model || 'APIC'}</span>
                    <span style={{ color: '#9CA3AF', fontSize: '0.75rem' }}>
                      {expanded === node.id ? '▲' : '▼'}
                    </span>
                  </div>
                </div>
                {expanded === node.id && renderNodeDetail(node)}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ── Fault Analysis ─────────────────────────────────────

    const FaultAnalysis = () => {
      const [filter, setFilter] = useState('all');
      const [expanded, setExpanded] = useState(null);
      const severities = ['all', 'critical', 'major', 'minor', 'warning'];
      const total = Object.values(data.severityCounts).reduce((a,b) => a+b, 0);

      const toggleFault = (i) => {
        setExpanded(prev => prev === i ? null : i);
      };

      const renderFaultDetail = (fault) => {
        const details = [
          { label: 'Fault Code', value: fault.code },
          { label: 'Cause', value: fault.cause },
          { label: 'Type', value: fault.type },
          { label: 'Domain', value: fault.domain },
          { label: 'Rule', value: fault.rule },
          { label: 'Unacknowledged', value: fault.nonAcked > 0 ? fault.nonAcked + ' of ' + fault.count + ' unacknowledged' : 'All acknowledged' },
        ];
        const urgencyBg = fault.urgency === 'High' ? '#FEF2F2' : fault.urgency === 'Medium' ? '#FFFBEB' : '#F0FDF4';
        const urgencyBorder = fault.urgency === 'High' ? '#FECACA' : fault.urgency === 'Medium' ? '#FDE68A' : '#BBF7D0';
        const urgencyColor = fault.urgency === 'High' ? '#DC2626' : fault.urgency === 'Medium' ? '#D97706' : '#059669';
        const urgencyIcon = fault.urgency === 'High' ? '🔴' : fault.urgency === 'Medium' ? '🟡' : '🟢';
        return (
          <div style={{ marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #F3F4F6' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '16px', marginBottom: '12px' }}>
              {details.map(item => (
                <div key={item.label}>
                  <p style={{ fontSize: '0.62rem', color: '#9CA3AF', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600 }}>
                    {item.label}
                  </p>
                  <p style={{ fontSize: '0.82rem', fontWeight: 500, marginTop: '3px', color: '#374151' }}>
                    {item.value}
                  </p>
                </div>
              ))}
            </div>
            <div style={{ background: severityBg(fault.severity), borderRadius: '8px', padding: '12px', marginBottom: '10px' }}>
              <p style={{ fontSize: '0.62rem', color: '#9CA3AF', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: '6px' }}>
                Full Description
              </p>
              <p style={{ fontSize: '0.82rem', color: '#374151', lineHeight: 1.6 }}>{fault.descr}</p>
            </div>
            <div style={{ background: urgencyBg, border: '1px solid ' + urgencyBorder, borderRadius: '8px', padding: '14px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' }}>
                <span style={{ fontSize: '1rem' }}>{urgencyIcon}</span>
                <p style={{ fontSize: '0.7rem', color: '#374151', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                  Operational Impact
                </p>
                <span style={{
                  fontSize: '0.65rem', fontWeight: 700,
                  color: urgencyColor,
                  background: urgencyBg,
                  border: '1px solid ' + urgencyBorder,
                  padding: '2px 8px', borderRadius: '999px'
                }}>
                  {fault.urgency} Urgency
                </span>
              </div>
              <p style={{ fontSize: '0.85rem', color: '#374151', lineHeight: 1.7 }}>
                {fault.operationalImpact}
              </p>
            </div>
          </div>
        );
      };

      const filtered = filter === 'all' ? data.faults : data.faults.filter(f => f.severity === filter);

      return (
        <div>
          <SectionLabel>Fabric Health</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '16px', color: '#1A1D2E' }}>
            Fault Analysis
          </h2>
          <div style={{ display: 'flex', gap: '10px', marginBottom: '16px', flexWrap: 'wrap' }}>
            {Object.entries(data.severityCounts).map(([sev, count]) => (
              <div key={sev} style={{
                display: 'flex', alignItems: 'center', gap: '8px',
                background: severityBg(sev),
                border: '1px solid ' + severityColor(sev) + '30',
                borderRadius: '10px', padding: '10px 16px'
              }}>
                <div style={{ width: 8, height: 8, borderRadius: '3px', background: severityColor(sev) }}/>
                <span style={{ fontSize: '0.8rem', textTransform: 'capitalize', color: '#374151', fontWeight: 500 }}>
                  {sev}
                </span>
                <span style={{ fontSize: '0.85rem', fontWeight: 800, color: severityColor(sev) }}>
                  {fmt(count)}
                </span>
              </div>
            ))}
            <div style={{
              display: 'flex', alignItems: 'center', gap: '8px',
              background: '#F9FAFB', border: '1px solid #E5E7EB',
              borderRadius: '10px', padding: '10px 16px'
            }}>
              <span style={{ fontSize: '0.8rem', color: '#6B7280', fontWeight: 500 }}>Total instances</span>
              <span style={{ fontSize: '0.85rem', fontWeight: 800, color: '#1A1D2E' }}>{fmt(total)}</span>
            </div>
          </div>
          <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', flexWrap: 'wrap' }}>
            {severities.map(s => (
              <button key={s} onClick={() => setFilter(s)} style={{
                padding: '6px 16px', borderRadius: '999px',
                border: '1px solid ' + (filter === s ? severityColor(s) : '#E5E7EB'),
                background: filter === s ? severityBg(s) : '#FFFFFF',
                color: filter === s ? severityColor(s) : '#6B7280',
                fontSize: '0.78rem', cursor: 'pointer',
                fontFamily: 'Inter', textTransform: 'capitalize', fontWeight: 500
              }}>
                {s === 'all' ? 'All (' + data.faults.length + ')' : s}
              </button>
            ))}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
            {filtered.map((fault, i) => (
              <div key={i}
                style={{
                  background: expanded === i ? '#FAFAFA' : '#FFFFFF',
                  border: '1px solid #E5E7EB',
                  borderRadius: '12px',
                  padding: '20px',
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                  cursor: 'pointer',
                  borderLeft: '4px solid ' + severityColor(fault.severity)
                }}
                onClick={() => toggleFault(i)}>
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', flex: 1 }}>
                    <div style={{
                      width: 10, height: 10, borderRadius: '3px',
                      background: severityColor(fault.severity),
                      marginTop: '6px', flexShrink: 0
                    }}/>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px', flexWrap: 'wrap' }}>
                        <span style={{ fontWeight: 700, fontSize: '0.9rem', color: severityColor(fault.severity) }}>
                          {fault.code}
                        </span>
                        <Badge label={fault.severity} color={severityColor(fault.severity)} bg={severityBg(fault.severity)}/>
                        <Badge label={fault.domain} color="#6B7280" bg="#F9FAFB"/>
                        <Badge label={fault.type} color="#6B7280" bg="#F9FAFB"/>
                        {fault.nonAcked > 0 && (
                          <Badge label={fault.nonAcked + ' unacked'} color="#DC2626" bg="#FEF2F2"/>
                        )}
                      </div>
                      <p style={{ fontSize: '0.82rem', color: '#374151', lineHeight: 1.5 }}>
                        {fault.descr}
                      </p>
                    </div>
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: '16px' }}>
                    <p style={{ fontSize: '1.1rem', fontWeight: 800, color: '#1A1D2E' }}>{fmt(fault.count)}</p>
                    <p style={{ fontSize: '0.65rem', color: '#9CA3AF' }}>instances</p>
                    <p style={{ fontSize: '0.65rem', color: '#9CA3AF', marginTop: '6px' }}>
                      {expanded === i ? '▲ less' : '▼ details'}
                    </p>
                  </div>
                </div>
                {expanded === i && renderFaultDetail(fault)}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ── Tenant Inventory ───────────────────────────────────

    const TenantInventory = () => (
      <div>
        <SectionLabel>Fabric Health</SectionLabel>
        <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '16px', color: '#1A1D2E' }}>Tenant Inventory</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px' }}>
          {data.tenants.map(t => (
            <Card key={t.name} style={{ borderTop: '3px solid #7C3AED' }}>
              <p style={{ fontWeight: 700, fontSize: '1rem', marginBottom: '6px', color: '#1A1D2E' }}>{t.name}</p>
              {t.descr ? (
                <p style={{ fontSize: '0.78rem', color: '#6B7280', marginBottom: '10px', lineHeight: 1.4 }}>{t.descr}</p>
              ) : (
                <div style={{
                  display: 'flex', alignItems: 'center', gap: '6px',
                  background: '#FEF2F2', borderRadius: '6px', padding: '6px 10px',
                  marginBottom: '10px'
                }}>
                  <span style={{ fontSize: '0.75rem' }}>⚠️</span>
                  <p style={{ fontSize: '0.75rem', color: '#DC2626', fontWeight: 500 }}>No description set</p>
                </div>
              )}
              <div style={{ borderTop: '1px solid #F3F4F6', paddingTop: '10px' }}>
                <p style={{ fontSize: '0.68rem', color: '#9CA3AF' }}>{t.dn}</p>
                <p style={{ fontSize: '0.68rem', color: '#9CA3AF', marginTop: '3px' }}>
                  Modified: {t.modTs ? new Date(t.modTs).toLocaleDateString() : 'N/A'}
                </p>
              </div>
            </Card>
          ))}
        </div>
      </div>
    );

    // ── Fabric Policies ────────────────────────────────────

    const FabricPolicies = () => {
      const { snmp, syslog, bgpRR } = data.policies;
      const policyChecks = [
        {
          label: 'BGP Route Reflector',
          icon: '🔄',
          configured: bgpRR.configured,
          detail: bgpRR.configured ? `${bgpRR.nodes.length} RR node(s) configured` : 'Not configured — MP-BGP for EVPN will not function correctly',
          critical: true
        },
        {
          label: 'SNMP Policy',
          icon: '📡',
          configured: snmp.configured,
          detail: snmp.adminSt === 'disabled' ? 'Policy exists but is currently disabled' : snmp.configured ? 'Enabled and active' : 'Not configured',
          critical: false
        },
        {
          label: 'Syslog Remote Destinations',
          icon: '📋',
          configured: syslog.configured,
          detail: syslog.configured ? `${syslog.destinations.length} destination(s) configured` : 'No remote syslog destinations configured',
          critical: false
        },
      ];

      return (
        <div>
          <SectionLabel>Fabric Health</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '16px', color: '#1A1D2E' }}>Fabric Policies</h2>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '28px' }}>
            {policyChecks.map(p => (
              <Card key={p.label} style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                borderLeft: `4px solid ${p.configured ? '#059669' : p.critical ? '#DC2626' : '#D97706'}`
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                  <span style={{ fontSize: '1.4rem' }}>{p.icon}</span>
                  <div>
                    <p style={{ fontWeight: 600, fontSize: '0.88rem', color: '#1A1D2E' }}>{p.label}</p>
                    <p style={{ fontSize: '0.76rem', color: '#6B7280', marginTop: '2px' }}>{p.detail}</p>
                  </div>
                </div>
                <Badge
                  label={p.configured ? '✓ Configured' : '✗ Not Configured'}
                  color={p.configured ? '#059669' : p.critical ? '#DC2626' : '#D97706'}
                  bg={p.configured ? '#ECFDF5' : p.critical ? '#FEF2F2' : '#FFFBEB'}/>
              </Card>
            ))}
          </div>

          <h3 style={{ fontSize: '1rem', fontWeight: 600, marginBottom: '12px', color: '#1A1D2E' }}>EPG Policy Enforcement</h3>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
            {data.epgs.map(e => (
              <Card key={e.dn} style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                borderLeft: `4px solid ${e.pcEnfPref === 'enforced' ? '#059669' : '#D97706'}`
              }}>
                <div>
                  <p style={{ fontWeight: 600, fontSize: '0.88rem', color: '#1A1D2E' }}>{e.name}</p>
                  <p style={{ fontSize: '0.7rem', color: '#9CA3AF', marginTop: '2px' }}>{e.dn}</p>
                </div>
                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                  <Badge
                    label={e.pcEnfPref}
                    color={e.pcEnfPref === 'enforced' ? '#059669' : '#D97706'}
                    bg={e.pcEnfPref === 'enforced' ? '#ECFDF5' : '#FFFBEB'}/>
                  <Badge
                    label={e.configSt}
                    color={e.configSt === 'applied' ? '#059669' : '#DC2626'}
                    bg={e.configSt === 'applied' ? '#ECFDF5' : '#FEF2F2'}/>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    };

    // ── Access Policies ────────────────────────────────────

    const AccessPolicies = () => {
      const ap = data.accessPolicies;
      const sections = [
        { title: 'VLAN Pools', icon: '🏷️', items: ap.vlanPools, extra: (i) => i.allocMode ? `Alloc: ${i.allocMode}` : null },
        { title: 'Physical Domains', icon: '🔌', items: ap.physDomains, extra: null },
        { title: 'Attachable Entity Profiles (AEP)', icon: '🔗', items: ap.aeps, extra: null },
        { title: 'Interface Policy Groups', icon: '⚙️', items: ap.interfacePolicyGroups, extra: null },
      ];

      return (
        <div>
          <SectionLabel>Fabric Health</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '16px', color: '#1A1D2E' }}>Access Policies</h2>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
            {sections.map(section => (
              <Card key={section.title} style={{ borderTop: '3px solid #0066CC' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '14px' }}>
                  <span style={{ fontSize: '1.1rem' }}>{section.icon}</span>
                  <p style={{ fontWeight: 600, fontSize: '0.9rem', color: '#1A1D2E' }}>{section.title}</p>
                  <span style={{
                    marginLeft: 'auto',
                    background: '#EBF4FF', color: '#0066CC',
                    fontSize: '0.7rem', fontWeight: 700,
                    padding: '2px 8px', borderRadius: '999px'
                  }}>{section.items.length}</span>
                </div>
                {section.items.length === 0 ? (
                  <div style={{ background: '#F9FAFB', borderRadius: '8px', padding: '12px', textAlign: 'center' }}>
                    <p style={{ fontSize: '0.78rem', color: '#9CA3AF' }}>None configured</p>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                    {section.items.map((item, i) => (
                      <div key={i} style={{
                        background: '#F9FAFB', borderRadius: '8px', padding: '10px 12px',
                        border: '1px solid #F3F4F6'
                      }}>
                        <p style={{ fontWeight: 600, fontSize: '0.82rem', color: '#1A1D2E' }}>{item.name}</p>
                        {item.descr && (
                          <p style={{ fontSize: '0.72rem', color: '#6B7280', marginTop: '2px' }}>{item.descr}</p>
                        )}
                        {section.extra && section.extra(item) && (
                          <p style={{ fontSize: '0.7rem', color: '#0066CC', marginTop: '2px', fontWeight: 500 }}>{section.extra(item)}</p>
                        )}
                        <p style={{ fontSize: '0.65rem', color: '#D1D5DB', marginTop: '4px', wordBreak: 'break-all' }}>{item.dn}</p>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            ))}
          </div>
        </div>
      );
    };

    // ── Readiness Score ────────────────────────────────────

    const ReadinessScore = () => {
      const { overallScore, level, criteria } = data.readiness;
      return (
        <div>
          <SectionLabel>Automation Readiness</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '24px', color: '#1A1D2E' }}>Overall Score</h2>
          <Card style={{ textAlign: 'center', padding: '32px', marginBottom: '20px', borderTop: `4px solid ${level.color}` }}>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '16px' }}>
              <ScoreRing score={overallScore} size={160}/>
            </div>
            <Badge label={level.label} color={level.color} bg={scoreBg(overallScore)}/>
            <p style={{ fontSize: '0.85rem', color: '#6B7280', marginTop: '10px', maxWidth: '400px', margin: '10px auto 0' }}>
              {level.description}
            </p>
          </Card>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            {Object.entries(criteria).map(([key, val]) => (
              <Card key={key}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <p style={{ fontWeight: 600, fontSize: '0.88rem', color: '#1A1D2E' }}>{criterionLabels[key]}</p>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span style={{ fontSize: '0.88rem', fontWeight: 800, color: scoreColor(val.score) }}>
                      {val.score}/100
                    </span>
                    <Badge
                      label={val.score >= 85 ? '✓ Met' : val.score >= 50 ? '⚠ Partial' : '✗ Gap'}
                      color={val.score >= 85 ? '#059669' : val.score >= 50 ? '#D97706' : '#DC2626'}
                      bg={val.score >= 85 ? '#ECFDF5' : val.score >= 50 ? '#FFFBEB' : '#FEF2F2'}/>
                  </div>
                </div>
                <ProgressBar value={val.score}/>
              </Card>
            ))}
          </div>
        </div>
      );
    };

    // ── Criteria Breakdown ─────────────────────────────────

    const CriteriaBreakdown = () => {
      const [expanded, setExpanded] = useState(null);
      const { criteria } = data.readiness;

      const toggleExpand = (key) => {
        setExpanded(prev => prev === key ? null : key);
      };

      const renderFinding = (f, i) => {
        const isIssue = f.indexOf('⚠') === 0;
        const isImpact = f.trim().indexOf('Impact:') === 0;
        const bg = isIssue ? '#FEF2F2' : isImpact ? '#FFF7ED' : '#F9FAFB';
        const border = isIssue ? '3px solid #DC2626' : isImpact ? '3px solid #EA580C' : '3px solid #E5E7EB';
        const iconColor = isIssue ? '#DC2626' : isImpact ? '#EA580C' : '#059669';
        const icon = isIssue ? '✗' : isImpact ? '⚡' : '✓';
        const text = isImpact ? f.replace('Impact:', 'Why this matters:') : f;
        const weight = isIssue ? 600 : 400;
        return (
          <div key={i} style={{
            display: 'flex', gap: '8px', marginBottom: '6px',
            background: bg, borderRadius: '6px', padding: '8px 10px',
            borderLeft: border
          }}>
            <span style={{ flexShrink: 0, fontSize: '0.8rem', color: iconColor }}>{icon}</span>
            <p style={{ fontSize: '0.82rem', color: '#374151', lineHeight: 1.5, fontWeight: weight }}>{text}</p>
          </div>
        );
      };

      return (
        <div>
          <SectionLabel>Automation Readiness</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '16px', color: '#1A1D2E' }}>
            Criteria Breakdown
          </h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            {Object.entries(criteria).map(([key, val]) => (
              <div key={key}
                className="card"
                style={{
                  background: '#FFFFFF',
                  border: '1px solid #E5E7EB',
                  borderRadius: '12px',
                  padding: '20px',
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                  cursor: 'pointer',
                  borderLeft: `4px solid ${scoreColor(val.score)}`,
                  background: expanded === key ? '#FAFAFA' : '#FFFFFF'
                }}
                onClick={() => toggleExpand(key)}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <span style={{ fontSize: '1rem' }}>
                      {val.score >= 85 ? '✅' : val.score >= 50 ? '⚠️' : '❌'}
                    </span>
                    <p style={{ fontWeight: 700, fontSize: '0.9rem', color: '#1A1D2E' }}>
                      {criterionLabels[key]}
                    </p>
                    <Badge
                      label={`${val.score}/100`}
                      color={scoreColor(val.score)}
                      bg={scoreBg(val.score)}/>
                  </div>
                  <span style={{ color: '#9CA3AF', fontSize: '0.75rem' }}>
                    {expanded === key ? '▲ less' : '▼ details'}
                  </span>
                </div>
                <ProgressBar value={val.score}/>
                {expanded === key && (
                  <div style={{ marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #F3F4F6' }}>
                    {val.findings && val.findings.length > 0 && (
                      <div style={{ marginBottom: '14px' }}>
                        <p style={{
                          fontSize: '0.65rem', fontWeight: 700, color: '#9CA3AF',
                          textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: '8px'
                        }}>
                          Findings
                        </p>
                        {val.findings.map((f, i) => renderFinding(f, i))}
                      </div>
                    )}
                    {val.recommendations && val.recommendations.length > 0 && (
                      <div style={{ marginBottom: '14px' }}>
                        <p style={{
                          fontSize: '0.65rem', fontWeight: 700, color: '#9CA3AF',
                          textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: '8px'
                        }}>
                          Recommended Actions
                        </p>
                        {val.recommendations.map((r, i) => (
                          <div key={i} style={{
                            display: 'flex', gap: '8px', marginBottom: '6px',
                            background: '#FFFBEB', borderRadius: '6px', padding: '8px 10px'
                          }}>
                            <span style={{ color: '#D97706', fontSize: '0.8rem', flexShrink: 0 }}>
                              ⚡
                            </span>
                            <p style={{ fontSize: '0.82rem', color: '#374151', lineHeight: 1.5 }}>{r}</p>
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{
                      display: 'flex', justifyContent: 'space-between',
                      alignItems: 'center', paddingTop: '8px',
                      borderTop: '1px solid #F3F4F6'
                    }}>
                      <span style={{ fontSize: '0.75rem', color: '#6B7280' }}>
                        Remediation effort: <strong style={{ color: '#1A1D2E' }}>{val.effort}</strong>
                      </span>
                      <a href={data.meta.contactUrl} target="_blank" style={{
                        fontSize: '0.75rem', color: '#0066CC',
                        textDecoration: 'none', fontWeight: 600
                      }}>
                        Talk to DeltaEdge →
                      </a>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ── Remediation Plan ───────────────────────────────────

    const RemediationPlan = () => {
      const { remediationPlan, overallScore } = data.readiness;
      if (overallScore >= 85) {
        return (
          <div>
            <SectionLabel>Automation Readiness</SectionLabel>
            <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '24px', color: '#1A1D2E' }}>Remediation Plan</h2>
            <Card style={{ textAlign: 'center', padding: '48px', borderTop: '3px solid #059669' }}>
              <p style={{ fontSize: '2.5rem', marginBottom: '12px' }}>🎉</p>
              <p style={{ fontWeight: 700, fontSize: '1.2rem', marginBottom: '8px', color: '#059669' }}>
                This fabric is Automation Ready
              </p>
              <p style={{ color: '#6B7280', fontSize: '0.88rem', maxWidth: '400px', margin: '0 auto' }}>
                No critical gaps identified. This fabric meets the DeltaEdge automation readiness standard.
              </p>
            </Card>
          </div>
        );
      }
      return (
        <div>
          <SectionLabel>Automation Readiness</SectionLabel>
          <h2 style={{ fontSize: '1.4rem', fontWeight: 700, marginBottom: '8px', color: '#1A1D2E' }}>Your Remediation Plan</h2>
          <p style={{ color: '#6B7280', fontSize: '0.85rem', marginBottom: '24px', lineHeight: 1.6 }}>
            Based on this assessment, DeltaEdge has identified <strong>{remediationPlan.length} gap(s)</strong> that
            need to be addressed before this fabric is ready for automation and AI-driven operations.
            Listed in recommended remediation order.
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '32px' }}>
            {remediationPlan.map((gap, i) => (
              <Card key={gap.criterion} style={{ borderLeft: `4px solid ${scoreColor(gap.score)}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <span style={{
                      width: '28px', height: '28px', borderRadius: '50%',
                      background: scoreBg(gap.score),
                      border: `2px solid ${scoreColor(gap.score)}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: '0.72rem', fontWeight: 800, color: scoreColor(gap.score),
                      flexShrink: 0
                    }}>{i+1}</span>
                    <div>
                      <p style={{ fontWeight: 700, fontSize: '0.92rem', color: '#1A1D2E' }}>
                        {criterionDisplayNames[gap.criterion]}
                      </p>
                      <p style={{ fontSize: '0.72rem', color: '#6B7280', marginTop: '2px' }}>
                        Score: <span style={{ color: scoreColor(gap.score), fontWeight: 700 }}>{gap.score}/100</span>
                        <span style={{ margin: '0 6px' }}>·</span>
                        Effort: <strong>{gap.effort}</strong>
                      </p>
                    </div>
                  </div>
                  <Badge label={gap.service} color="#0066CC" bg="#EBF4FF"/>
                </div>
                {gap.recommendations.map((rec, j) => (
                  <div key={j} style={{
                    display: 'flex', gap: '8px', marginBottom: '6px',
                    background: '#FFFBEB', borderRadius: '6px', padding: '8px 10px'
                  }}>
                    <span style={{ color: '#D97706', fontSize: '0.8rem', flexShrink: 0 }}>⚡</span>
                    <p style={{ fontSize: '0.82rem', color: '#374151', lineHeight: 1.5 }}>{rec}</p>
                  </div>
                ))}
              </Card>
            ))}
          </div>

          <Card style={{
            background: 'linear-gradient(135deg, #EBF4FF 0%, #ECFDF5 100%)',
            border: '1px solid #0066CC20',
            textAlign: 'center',
            padding: '36px'
          }}>
            <svg width="44" height="44" viewBox="0 0 32 32" fill="none" style={{ margin: '0 auto 16px' }}>
              <defs>
                <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#0066CC"/>
                  <stop offset="100%" stopColor="#059669"/>
                </linearGradient>
              </defs>
              <path d="M16 2 L30 28 L2 28 Z" stroke="url(#cg)" strokeWidth="2.5" strokeLinejoin="round"/>
              <path d="M16 9 L25 25 L7 25 Z" fill="url(#cg)" opacity="0.8"/>
            </svg>
            <h3 style={{ fontSize: '1.2rem', fontWeight: 700, marginBottom: '8px', color: '#1A1D2E' }}>
              Ready to close these gaps?
            </h3>
            <p style={{ color: '#6B7280', fontSize: '0.85rem', maxWidth: '480px', margin: '0 auto 24px', lineHeight: 1.6 }}>
              DeltaEdge Solutions offers structured remediation engagements covering all identified gaps —
              with clear deliverables, timelines, and full accountability. Principal-led. Specialist-backed.
            </p>
            <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
              <a href={data.meta.clarityUrl} target="_blank" style={{
                background: '#0066CC', color: '#FFFFFF',
                padding: '10px 24px', borderRadius: '8px',
                textDecoration: 'none', fontWeight: 700, fontSize: '0.85rem'
              }}>
                Book a Free Assessment Call
              </a>
              <a href={data.meta.contactUrl} target="_blank" style={{
                background: '#FFFFFF', color: '#0066CC',
                padding: '10px 24px', borderRadius: '8px',
                textDecoration: 'none', fontWeight: 600, fontSize: '0.85rem',
                border: '1px solid #0066CC'
              }}>
                Contact DeltaEdge
              </a>
            </div>
            <p style={{ color: '#9CA3AF', fontSize: '0.7rem', marginTop: '16px' }}>
              🌐 {data.meta.website} · 📧 {data.meta.contact}
            </p>
          </Card>
        </div>
      );
    };

    // ── Export Functions ───────────────────────────────────

    const exportCSV = () => {
      const rows = [];

      rows.push(['=== FABRIC INFORMATION ===']);
      rows.push(['APIC Host', data.meta.apicHost]);
      rows.push(['APIC Version', data.apic.version]);
      rows.push(['Report Generated', new Date(data.meta.generatedAt).toLocaleString()]);
      rows.push(['Prepared By', data.meta.consultantName || 'DeltaEdge Solutions']);
      rows.push(['Overall Health Score', data.health.current]);
      rows.push(['Automation Readiness Score', data.readiness.overallScore]);
      rows.push(['Readiness Level', data.readiness.level.label]);
      rows.push([]);

      rows.push(['=== NODE INVENTORY ===']);
      rows.push(['ID', 'Name', 'Role', 'Model', 'Address', 'Fabric State', 'Version', 'Serial']);
      data.nodes.forEach(n => rows.push([n.id, n.name, n.role, n.model, n.address, n.fabricSt, n.version, n.serial]));
      rows.push([]);

      rows.push(['=== FAULT SUMMARY ===']);
      rows.push(['Code', 'Severity', 'Count', 'Non-Acknowledged', 'Cause', 'Domain', 'Type', 'Description']);
      data.faults.forEach(f => rows.push([f.code, f.severity, f.count, f.nonAcked, f.cause, f.domain, f.type, `"${f.descr}"`]));
      rows.push([]);

      rows.push(['=== TENANT INVENTORY ===']);
      rows.push(['Name', 'DN', 'Description', 'Last Modified']);
      data.tenants.forEach(t => rows.push([t.name, t.dn, t.descr || 'No description', t.modTs]));
      rows.push([]);

      rows.push(['=== ACCESS POLICIES ===']);
      rows.push(['Type', 'Name', 'DN', 'Description']);
      data.accessPolicies.vlanPools.forEach(i => rows.push(['VLAN Pool', i.name, i.dn, i.descr]));
      data.accessPolicies.physDomains.forEach(i => rows.push(['Physical Domain', i.name, i.dn, i.descr]));
      data.accessPolicies.aeps.forEach(i => rows.push(['AEP', i.name, i.dn, i.descr]));
      data.accessPolicies.interfacePolicyGroups.forEach(i => rows.push(['Interface Policy Group', i.name, i.dn, i.descr]));
      rows.push([]);

      rows.push(['=== AUTOMATION READINESS ===']);
      rows.push(['Criterion', 'Score', 'Status', 'Effort']);
      Object.entries(data.readiness.criteria).forEach(([k, v]) => {
        rows.push([
          criterionDisplayNames[k],
          v.score,
          v.score >= 85 ? 'Met' : v.score >= 50 ? 'Partial' : 'Gap',
          v.effort
        ]);
      });
      rows.push([]);

      rows.push(['=== REMEDIATION PLAN ===']);
      rows.push(['Priority', 'Criterion', 'Score', 'Effort', 'Recommended Service', 'Actions']);
      data.readiness.remediationPlan.forEach((g, i) => {
        rows.push([
          i + 1,
          criterionDisplayNames[g.criterion],
          g.score,
          g.effort,
          g.service,
          `"${g.recommendations.join(' | ')}"`
        ]);
      });

      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `FabricPulse_${data.meta.apicHost}_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    const exportPDF = () => {
      const printDiv = document.getElementById('print-all-sections');
      if (printDiv) {
        printDiv.style.display = 'block';
        window.print();
        printDiv.style.display = 'none';
      }
    };

    // ── All Sections for Print ─────────────────────────────

    const AllSectionsForPrint = () => (
      <div id="print-all-sections" style={{ display: 'none' }}>
        <PrintHeader/>
        <div className="print-section"><Summary/></div>
        <div className="print-section"><NodeInventory/></div>
        <div className="print-section"><FaultAnalysis/></div>
        <div className="print-section"><TenantInventory/></div>
        <div className="print-section"><FabricPolicies/></div>
        <div className="print-section"><AccessPolicies/></div>
        <div className="print-section"><ReadinessScore/></div>
        <div className="print-section"><CriteriaBreakdown/></div>
        <div className="print-section"><RemediationPlan/></div>
      </div>
    );

    // ── Main App ───────────────────────────────────────────

    const App = () => {
      const [active, setActive] = useState('summary');
      const panels = {
        summary: <Summary/>,
        nodes: <NodeInventory/>,
        faults: <FaultAnalysis/>,
        tenants: <TenantInventory/>,
        policies: <FabricPolicies/>,
        access: <AccessPolicies/>,
        readiness: <ReadinessScore/>,
        criteria: <CriteriaBreakdown/>,
        remediation: <RemediationPlan/>
      };
      return (
        <>
          <Header onExportCSV={exportCSV} onExportPDF={exportPDF}/>
          <Sidebar active={active} onSelect={setActive}/>
          <main id="main-content" style={{
            marginLeft: '240px',
            marginTop: '60px',
            padding: '32px',
            minHeight: 'calc(100vh - 60px)',
            background: '#F4F6FA'
          }}>
            {panels[active]}
          </main>
          <AllSectionsForPrint/>
        </>
      );
    };

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
